# Homepage: publish site/ as-is (static, no build step) to GitHub Pages,
# served at https://gmartinu.github.io/pump-sim/ (the page uses relative paths only).
# Everything under site/ is published: notes about the page live in docs/site/ (DECISIONS §30).
# Repository setting required once: Settings → Pages → Source = "GitHub Actions".
name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
