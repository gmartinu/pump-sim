# Release: build the Windows executable from this repository, have SignPath sign it, attach the
# signed file to the GitHub release. Policy and roles: CODE_SIGNING.md.
#
# Until the SignPath variables below are set (Foundation application pending), the sign job is
# skipped and the release publishes the CI-built executable unsigned, with notes that say so.
#
# Repository configuration (Settings → Secrets and variables → Actions):
#   variables  SIGNPATH_ORGANIZATION_ID, SIGNPATH_PROJECT_SLUG, SIGNPATH_SIGNING_POLICY_SLUG
#   secret     SIGNPATH_API_TOKEN (a SignPath CI user token, submitter role only)
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
          cache: npm
      # Every release note opens with this version's CHANGELOG.md entry (DECISIONS §33 C5): fail early
      # when it is missing, before anything is built or staged.
      - name: CHANGELOG entry for the tag
        run: node tools/changelog.mjs "$GITHUB_REF_NAME"
      - run: npm ci
      - run: npm run ci

  npm:
    needs: test
    # Independent of build/sign/release: an npm failure never blocks the GitHub release.
    # npm staged publishing over Trusted Publishing (OIDC, no NPM_TOKEN): needs npm >= 11.15.0 and
    # Node >= 22.14.0. The trusted publisher on npmjs.com names this repository, release.yml and
    # environment release, and allows stage only (not publish): CI stages the version and a
    # maintainer approves it, with 2FA, in the Staged Packages tab on npmjs.com.
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
          registry-url: 'https://registry.npmjs.org'
          cache: npm
      - name: Upgrade npm for staged publishing
        run: npm install -g npm@^11.15.0
      - name: Tag matches package.json version
        run: |
          v="$(node -p "require('./package.json').version")"
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != package.json v$v"; exit 1; }
      - run: npm ci
      - run: npm stage publish --provenance --access public

  build:
    needs: test
    # windows: build-sea.mjs extracts node.exe from the nodejs.org zip with bsdtar (GNU tar cannot).
    runs-on: windows-latest
    outputs:
      artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # The SEA blob format follows the Node version: must be exactly NODE_VERSION of tools/build-sea.mjs.
          node-version: '22.20.0'
          cache: npm
      - name: Tag matches package.json version
        shell: bash
        run: |
          v="$(node -p "require('./package.json').version")"
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != package.json v$v"; exit 1; }
      # build-sea.mjs builds the window host (tools/window-go, DECISIONS §32) and embeds it.
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/window-go/go.mod
          cache-dependency-path: tools/window-go/go.sum
      - run: npm ci
      - run: npm run build:sea:win
      - id: upload-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: pump-sim-win-x64-unsigned
          path: build/sea/pump-sim-win-x64.exe
          if-no-files-found: error

  sign:
    needs: build
    if: vars.SIGNPATH_ORGANIZATION_ID != '' && vars.SIGNPATH_PROJECT_SLUG != '' && vars.SIGNPATH_SIGNING_POLICY_SLUG != ''
    runs-on: ubuntu-latest
    # Optional: protect this environment with required reviewers so each signing request is approved
    # in GitHub as well as in SignPath (CODE_SIGNING.md, "Approval").
    environment: release
    steps:
      - name: Submit signing request to SignPath
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ needs.build.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed
      - uses: actions/upload-artifact@v4
        with:
          name: pump-sim-win-x64-signed
          path: signed/pump-sim-win-x64.exe
          if-no-files-found: error

  release:
    needs: [build, sign]
    # Runs after a successful sign, or after a skipped one (SignPath not configured yet).
    if: ${{ !cancelled() && needs.build.result == 'success' && (needs.sign.result == 'success' || needs.sign.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      SIGNED: ${{ needs.sign.result == 'success' }}
    steps:
      # CHANGELOG.md and tools/changelog.mjs for the "Changes" section of the notes.
      - uses: actions/checkout@v4
      - if: env.SIGNED == 'true'
        uses: actions/download-artifact@v4
        with:
          name: pump-sim-win-x64-signed
          path: out
      - if: env.SIGNED != 'true'
        uses: actions/download-artifact@v4
        with:
          name: pump-sim-win-x64-unsigned
          path: out
      - name: Checksum
        working-directory: out
        run: sha256sum pump-sim-win-x64.exe > pump-sim-win-x64.exe.sha256
      - name: Create the GitHub release with the executable
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$SIGNED" = "true" ]; then
            assinatura="Signed through SignPath (CODE_SIGNING.md)."
          else
            assinatura="Not code-signed yet (SignPath Foundation application pending); Windows SmartScreen will warn. Verify the download against pump-sim-win-x64.exe.sha256."
          fi
          # Notes: the short changelog first, then the signing note; --generate-notes appends the PR list.
          node tools/changelog.mjs "$GITHUB_REF_NAME" > notes.md
          printf '\n%s\n' "$assinatura" >> notes.md
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" \
            --notes-file notes.md --generate-notes --verify-tag \
            out/pump-sim-win-x64.exe out/pump-sim-win-x64.exe.sha256
